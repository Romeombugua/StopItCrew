server {
        listen 66.29.155.113:80;
        server_name stopitcrew.com www.stopitcrew.com;


        return 301 https://$host$request_uri;
}

server {
        listen 66.29.155.113:443 ssl http2;
        server_name stopitcrew.com www.stopitcrew.com;


        ssl_certificate /etc/letsencrypt/live/stopitcrew.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stopitcrew.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        root /var/www/StopItCrew;
        index index.html index.htm;

        location / {
                try_files $uri $uri/ =404;
        }


        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
                expires 30d;
                add_header Cache-Control "public, no-transform";
        }
}
