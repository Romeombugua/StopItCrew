        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Whole poster visible below the header: as big as the viewport allows without cropping. */
      main.poster img {
        display: block;
        max-width: 100vw;
        max-height: calc(100vh - var(--header-h));
        width: auto;
        height: auto;
        box-shadow: 0 0 40px rgba(0, 0, 0, 0.35);
